<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ยืนยันรหัส OTP - Ratchaburi Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-sky: #00BFFF;
      --color-blue: #1b74af;
      --color-navy: #1e508a;
      --color-dark: #0f1d2a;
      --ink: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    * { 
      box-sizing: border-box; 
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, var(--color-blue) 0%, var(--color-navy) 50%, var(--color-dark) 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      top: -150px;
      right: -150px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.2), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -150px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.25), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .otp-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.6);
      padding: 40px 36px 32px;
      width: 100%;
      max-width: 440px;
      margin: 0 16px;
      text-align: center;
    }

    .logo-img {
      width: 72px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(37, 99, 235, 0.15));
    }

    h2 {
      font-weight: 600;
      font-size: 22px;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 20px;
      font-weight: 400;
    }

    .ref-badge {
      display: inline-block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
    }

    .ref-badge strong {
      color: #1d4ed8;
      font-weight: 700;
      font-size: 15px;
    }

    .user-info {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .error-box {
      background: #fef2f2;
      color: #ef4444;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13.5px;
      border: 1px solid #fecaca;
      text-align: center;
      font-weight: 500;
      line-height: 1.5;
    }

    .success-box {
      background: #f0fdf4;
      color: #16a34a;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 13.5px;
      border: 1px solid #bbf7d0;
      text-align: center;
      font-weight: 500;
    }

    /* 6-box OTP Input Group */
    .otp-inputs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .otp-digit {
      width: 48px;
      height: 56px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      font-family: 'Prompt', sans-serif;
      color: var(--ink);
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: all 0.2s ease;
      outline: none;
    }

    .otp-digit:focus {
      background: #ffffff;
      border-color: var(--color-blue);
      box-shadow: 0 0 0 4px var(--focus-ring);
      transform: translateY(-2px);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--color-blue), var(--color-navy));
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Prompt', sans-serif;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      margin-bottom: 12px;
    }

    .btn-submit:hover:not(:disabled) { 
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      background: linear-gradient(135deg, var(--color-sky), var(--color-blue));
    }

    .btn-submit:active:not(:disabled) { 
      transform: translateY(1px);
    }

    .btn-resend {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: var(--color-blue);
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Prompt', sans-serif;
    }

    .btn-resend:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: var(--color-blue);
    }

    .btn-resend:disabled {
      color: #94a3b8;
      background: #f8fafc;
      border-color: #e2e8f0;
      cursor: not-allowed;
    }

    .btn-back {
      display: inline-block;
      width: 100%;
      padding: 13px;
      background: #f1f5f9;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-top: 10px;
    }

    .btn-back:hover {
      background: #e2e8f0;
    }

    .footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .otp-container { 
        padding: 32px 20px 24px;
      }
      .otp-digit {
        width: 42px;
        height: 50px;
        font-size: 20px;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <div class="otp-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/%E0%B8%95%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%97%E0%B8%A3%E0%B8%A7%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%A3%E0%B8%93%E0%B8%AA%E0%B8%B8%E0%B8%82%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88.png" alt="MOPH Logo" class="logo-img" />

    {{blockedView}}

    {{otpFormView}}

    <div class="footer">
      Ratchaburi Hospital Authentication Server
    </div>
  </div>

  <script>
    const digits = document.querySelectorAll('.otp-digit');
    const fullOtpInput = document.getElementById('fullOtpInput');
    const otpForm = document.getElementById('otpForm');
    const resendBtn = document.getElementById('resendBtn');
    const resendTimerSpan = document.getElementById('resendTimer');

    if (digits.length > 0) {
      // Auto focus on first box
      digits[0].focus();

      digits.forEach((input, index) => {
        // Allow only numbers
        input.addEventListener('input', (e) => {
          const val = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = val ? val[val.length - 1] : '';

          if (e.target.value && index < digits.length - 1) {
            digits[index + 1].focus();
          }
          updateCombinedOtp();
        });

        // Handle Backspace
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            digits[index - 1].focus();
          }
        });

        // Handle Paste
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
          if (pasteData) {
            for (let i = 0; i < digits.length; i++) {
              if (pasteData[i]) {
                digits[i].value = pasteData[i];
              }
            }
            const focusIndex = Math.min(pasteData.length, digits.length - 1);
            digits[focusIndex].focus();
            updateCombinedOtp();
          }
        });
      });

      function updateCombinedOtp() {
        let combined = '';
        digits.forEach(input => combined += input.value);
        if (fullOtpInput) {
          fullOtpInput.value = combined;
        }
      }

      if (otpForm) {
        otpForm.addEventListener('submit', (e) => {
          updateCombinedOtp();
          if (!fullOtpInput.value || fullOtpInput.value.length < 6) {
            e.preventDefault();
            alert('กรุณากรอกรหัส OTP ให้ครบทั้ง 6 หลัก');
            digits[0].focus();
          } else {
            const submitBtn = otpForm.querySelector('button[type="submit"]');
            if (submitBtn) {
              submitBtn.disabled = true;
              submitBtn.innerText = 'กำลังตรวจสอบ OTP...';
            }
          }
        });
      }
    }

    // 60 Seconds Countdown Timer for Resend
    if (resendBtn && resendTimerSpan) {
      let timeLeft = 60;
      resendBtn.disabled = true;

      const countdownInterval = setInterval(() => {
        timeLeft--;
        resendTimerSpan.textContent = ` (${timeLeft}s)`;

        if (timeLeft <= 0) {
          clearInterval(countdownInterval);
          resendBtn.disabled = false;
          resendTimerSpan.textContent = '';
        }
      }, 1000);
    }
  </script>
</body>
</html>
