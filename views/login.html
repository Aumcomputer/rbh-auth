<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ratchaburi Hospital Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-sky: #00BFFF;
      --color-blue: #1b74af;
      --color-navy: #1e508a;
      --color-dark: #0f1d2a;
      
      --ink: #1e293b;
      --muted: #64748b;
      --border: #cbd5e1;
      --focus-ring: rgba(37, 99, 235, 0.25);
    }

    * { 
      box-sizing: border-box; 
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh; 
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, var(--color-blue) 0%, var(--color-navy) 50%, var(--color-dark) 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 600px;
      height: 600px;
      top: -150px;
      right: -150px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.3), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: "";
      position: fixed;
      width: 500px;
      height: 500px;
      bottom: -150px;
      left: -150px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.35), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.6);
      padding: 44px 40px 32px;
      width: 100%;
      max-width: 380px;
      margin: 0 16px;
      text-align: center;
    }

    h2 {
      font-weight: 600;
      font-size: 22px;
      color: var(--ink);
      margin: 0 0 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      font-weight: 400;
    }

    .error {
      background: #fef2f2;
      color: #ef4444;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 13.5px;
      border: 1px solid #fecaca;
      text-align: left;
    }

    form { text-align: left; }

    label {
      display: block;
      font-size: 13px;
      color: var(--ink);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .field { margin-bottom: 18px; }

    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 15px;
      font-family: 'Prompt', sans-serif;
      color: var(--ink);
      transition: all 0.2s ease;
    }

    input::placeholder { color: #94a3b8; }

    input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--color-blue);
      box-shadow: 0 0 0 4px var(--focus-ring);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, var(--color-blue), var(--color-navy));
      color: #ffffff;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Prompt', sans-serif;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    button:hover { 
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
      transform: translateY(-1px);
      background: linear-gradient(135deg, var(--color-sky), var(--color-blue));
    }
    
    button:active { 
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
    }
    .logo-img {
      width: 100px;
      height: auto;
      max-height: 100px;
      margin: 0 auto 16px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(37, 99, 235, 0.15));
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .login-container { 
        padding: 32px 24px 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/f/f9/%E0%B8%95%E0%B8%A3%E0%B8%B2%E0%B8%81%E0%B8%A3%E0%B8%B0%E0%B8%97%E0%B8%A3%E0%B8%A7%E0%B8%87%E0%B8%AA%E0%B8%B2%E0%B8%98%E0%B8%B2%E0%B8%A3%E0%B8%93%E0%B8%AA%E0%B8%B8%E0%B8%82%E0%B9%83%E0%B8%AB%E0%B8%A1%E0%B9%88.png" alt="MOPH Logo" class="logo-img" />
    <h2>Ratchaburi Hospital</h2>
    <div class="subtitle">RBH · Portal Login</div>

    {{errorMessage}}

    <form id="loginForm" method="post" action="/rbhlogin">
      <input type="hidden" id="redirectInput" name="redirect" value="{{redirect}}" />
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" placeholder="RBH CONNEXT Username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submitBtn">Login</button>
    </form>

    <div class="footer">
      Ratchaburi Hospital Authentication Server © {{year}}
    </div>
  </div>

  <script>
    // Grab the actual URL from the browser if Nginx did an internal redirect
    const redirectInput = document.getElementById('redirectInput');
    if (window.location.pathname && window.location.pathname !== '/rbhlogin') {
      redirectInput.value = window.location.pathname + window.location.search + window.location.hash;
    }

    // Prevent multiple clicks
    const loginForm = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    loginForm.addEventListener('submit', function() {
      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';
      submitBtn.style.cursor = 'not-allowed';
      submitBtn.innerText = 'กำลังตรวจสอบข้อมูล...';
    });
  </script>
</body>
</html>
